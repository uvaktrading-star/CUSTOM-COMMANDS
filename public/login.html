<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZANTA-MD | Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/src/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/src/apple-touch-icon.png">
    <link rel="shortcut icon" href="zanta.png" type="/src/favicon.ico">

    <!-- Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.zanta-mini.store">
    <meta property="og:title" content="ZANTA MINI LOGIN">
    <meta property="og:description" content="The Powerful WhatsApp bot.">
    <meta property="og:image" content="https://www.zanta-mini.store/src/anime-boy-dark-hair-casual-look-desktop-wallpaper-cover.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.zanta-mini.store">
    <meta property="twitter:title" content="ZANTA MINI">
    <meta property="twitter:description" content="The Powerful WhatsApp bot.">
    <meta property="twitter:image" content="https://www.zanta-mini.store/zanta.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 16px 100px 16px;
            overflow-x: hidden;
        }

        /* ========== SPACE BACKGROUND ========== */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at center, #0a1a2d 0%, #000000 100%);
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #b6e3ff;
            border-radius: 50%;
            opacity: 0.6;
            animation: move linear infinite;
        }

        @keyframes move {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ========== TECH GRID ========== */
        .tech-grid {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
            background-image:  
                linear-gradient(rgba(0, 100, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 100, 255, 0.04) 1px, transparent 1px);
            background-size: 55px 55px;
        }

        /* ========== ANIMATED GRADIENT BLOB ========== */
        .blob-1 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #3b82f6, #06b6d4);
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.06;
            top: -150px;
            right: -150px;
            animation: floatBlob 20s infinite alternate;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-100px, 100px) scale(1.3); }
        }

        /* ========== GLASS CARD ========== */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(8, 15, 30, 0.65);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(0, 150, 255, 0.15);
            border-radius: 2.5rem;
            padding: 60px 28px 40px 28px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
            transition: all 0.4s ease;
        }

        .glass-card:hover {
            border-color: rgba(0, 212, 255, 0.25);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }

        /* ========== LOGO ========== */
        .logo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(0, 150, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.2);
            transition: all 0.4s ease;
        }

        .logo-wrapper img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.35);
        }

        .logo-ring {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, #3b82f6, transparent, #06b6d4, transparent);
            z-index: -1;
            animation: spinRing 4s linear infinite;
            opacity: 0.5;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== TYPOGRAPHY ========== */
        .brand {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .brand .blue {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand .white {
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.65rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .divider-line {
            width: 50px;
            height: 2px;
            margin: 16px auto 24px auto;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            border-radius: 2px;
        }

        /* ========== FORM ========== */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
            margin-left: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .input-group label i {
            margin-right: 8px;
            color: #3b82f6;
        }

        .custom-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .custom-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.06);
            background: rgba(0, 0, 0, 0.4);
        }

        .custom-input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
        }

        .custom-input::-webkit-inner-spin-button,
        .custom-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .custom-input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ========== BUTTON ========== */
        .btn-primary {
            width: 100%;
            padding: 18px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: #000;
            box-shadow: 0 4px 25px rgba(59, 130, 246, 0.2);
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary.auto-glow {
            animation: glowPulse 1.5s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 4px 25px rgba(59, 130, 246, 0.2); }
            50% { box-shadow: 0 4px 50px rgba(59, 130, 246, 0.6), 0 0 80px rgba(59, 130, 246, 0.2); }
        }

        /* ========== ERROR MESSAGE ========== */
        #errorMsg {
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 14px;
            display: none;
            font-weight: 500;
        }

        #errorMsg.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        /* ========== STATUS ROW ========== */
        .status-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .status-item i {
            color: rgba(255, 255, 255, 0.15);
        }

        /* ========== MUSIC TAG ========== */
        .music-tag {
            margin-top: 18px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.6; }
        }

        /* ========== BACK LINK ========== */
        .back-link {
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 10;
        }

        .back-link:hover {
            color: #3b82f6;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .glass-card {
                padding: 40px 20px 30px 20px;
                border-radius: 32px;
            }
            .brand { font-size: 2rem; }
            .logo-wrapper { width: 85px; height: 85px; }
            .custom-input { padding: 14px 18px; font-size: 0.85rem; }
            .btn-primary { padding: 16px 20px; font-size: 0.7rem; }
            .status-row { gap: 16px; flex-wrap: wrap; }
        }

        @media (max-width: 380px) {
            .brand { font-size: 1.6rem; }
            .glass-card { padding: 30px 16px 24px 16px; }
            .custom-input { padding: 12px 16px; font-size: 0.8rem; }
            .btn-primary { padding: 14px 16px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <!-- ====== STARS BACKGROUND ====== -->
    <div class="stars-container" id="stars"></div>

    <!-- ====== TECH GRID ====== -->
    <div class="tech-grid"></div>

    <!-- ====== ANIMATED BLOB ====== -->
    <div class="blob-1"></div>

    <!-- ====== MAIN GLASS CARD ====== -->
    <div class="glass-card">

        <!-- Logo -->
        <div class="logo-wrapper">
            <div class="logo-ring"></div>
            <img src="https://www.zanta-mini.store/src/zanta.png" alt="ZANTA">
        </div>

        <!-- Brand -->
        <div class="brand">
            <span class="blue">ZANTA</span><span class="white">-MD</span>
        </div>
        <div class="subtitle">Dashboard Login</div>
        <div class="divider-line"></div>

        <!-- Form -->
        <div class="input-group">
            <label><i class="fas fa-phone"></i> WhatsApp Number</label>
            <input type="text" id="botId" class="custom-input" placeholder="94743404814" inputmode="numeric">
        </div>

        <div class="input-group">
            <label><i class="fas fa-lock"></i> Bot Password</label>
            <input type="password" id="botPass" class="custom-input" placeholder="Enter your password">
        </div>

        <!-- Login Button -->
        <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
            <i class="fas fa-sign-in-alt"></i>
            <span>Login Now</span>
            <i class="fas fa-arrow-right"></i>
        </button>

        <!-- Error Message -->
        <p id="errorMsg"></p>

        <!-- Music Tag -->
        <div class="music-tag">
            <i class="fas fa-music"></i> Music starts on click
        </div>

        <!-- Status Row -->
        <div class="status-row">
            <div class="status-item">
                <div class="status-dot"></div>
                Secure
            </div>
            <div class="status-item">
                <i class="fas fa-shield-alt"></i>
                V3.0.0
            </div>
            <div class="status-item">
                <i class="fas fa-lock"></i>
                Encrypted
            </div>
        </div>
    </div>

    <!-- Back Link -->
    <a href="/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <!-- ====== AUDIO ====== -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/5zx7hg.mp3" type="audio/mpeg">
    </audio>

    <!-- ====== SCRIPTS ====== -->
    <script>
        // ═══════════════════════════════════════
        // 🎯 STARS BACKGROUND
        // ═══════════════════════════════════════
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = Math.random() * 5 + 3 + 's';
            star.style.animationDelay = Math.random() * 8 + 's';
            starsContainer.appendChild(star);
        }

        // ═══════════════════════════════════════
        // 🎯 MUSIC TRIGGER
        // ═══════════════════════════════════════
        window.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music.paused) music.play().catch(() => {});
        }, { once: true });

        // ═══════════════════════════════════════
        // 🎯 AUTO GLOW BUTTON
        // ═══════════════════════════════════════
        const loginBtn = document.getElementById('loginBtn');
        let isGlowing = false;

        setInterval(() => {
            if (!isGlowing) {
                loginBtn.classList.add('auto-glow');
            } else {
                loginBtn.classList.remove('auto-glow');
            }
            isGlowing = !isGlowing;
        }, 2000);

        // ═══════════════════════════════════════
        // 🎯 ENTER KEY SUPPORT
        // ═══════════════════════════════════════
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // ═══════════════════════════════════════
        // 🎯 LOGIN FUNCTION
        // 🔥 web-auth API එකෙන් login වෙනවා
        // 🔥 botNumber එක localStorage එකේ save කරනවා
        // ═══════════════════════════════════════
        const API_URL = 'https://zanta-web-auth.vercel.app/api/auth';

        async function handleLogin() {
            const id = document.getElementById('botId').value.trim();
            const password = document.getElementById('botPass').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');

            // Reset error
            errorMsg.classList.remove('show');
            errorMsg.innerText = '';

            // Validation
            if (!id || !password) {
                errorMsg.innerText = "Please fill all fields!";
                errorMsg.classList.add('show');
                return;
            }

            btn.innerText = "VERIFYING...";
            btn.disabled = true;

            try {
                // 🔥 web-auth API එකට login request එක යවනවා
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        id: id, 
                        password: password, 
                        action: 'login' 
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // ✅ Login success - botNumber එක save කරනවා
                    // 🔥 මේ botNumber එකෙන් තමයි commands save/load වෙන්නේ
                    localStorage.setItem('bot_id', id);
                    localStorage.setItem('bot_pass', password);
                    
                    // web-auth API එකෙන් එන අමතර data save කරනවා
                    if (data.settings) {
                        localStorage.setItem('bot_settings', JSON.stringify(data.settings));
                    }
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    if (data.user) {
                        localStorage.setItem('bot_user', JSON.stringify(data.user));
                    }
                    
                    // ✅ Dashboard එකට යනවා
                    window.location.href = 'dashboard.html';
                } else {
                    // ❌ Login failed
                    errorMsg.innerText = data.error || data.message || "Invalid credentials!";
                    errorMsg.classList.add('show');
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Login Now</span><i class="fas fa-arrow-right"></i>';
                    btn.disabled = false;
                }
            } catch (e) {
                console.error('Login error:', e);
                errorMsg.innerText = "Connection Error! Please try again.";
                errorMsg.classList.add('show');
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Login Now</span><i class="fas fa-arrow-right"></i>';
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
